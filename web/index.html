<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Daily — английский с нуля</title>
<meta name="theme-color" content="#1f2a44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#1f2a44;--mute:#6b7280;--line:#e7dfd2;--acc:#e8613c;--acc2:#2f6f62;--ok:#2f8a57;--bad:#c2410c;--soft:#fbe7dc;--soft2:#e3efe9;--warn:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#141a26;--card:#1d2535;--ink:#eef1f6;--mute:#9aa3b2;--line:#2c3547;--acc:#ff7a52;--acc2:#5fb3a1;--ok:#4cc38a;--bad:#ff8a5c;--soft:#3a2a26;--soft2:#1f3530;--warn:#3a3322}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Onest,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 104px}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;margin:0;letter-spacing:-.01em;font-weight:700}
h1{font-size:21px}h2{font-size:17px}h3{font-size:14px;font-weight:500}
p{margin:6px 0}
.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:var(--ink);color:var(--bg);border:0}
.hero .mute{color:inherit;opacity:.7}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stat{display:flex;gap:10px;margin-top:14px}
.stat div{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:10px}
.stat b{display:block;font:700 20px Unbounded,sans-serif}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.hero .bar{background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit}
.task:first-of-type{border-top:0}
.task .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.task.done .ic{background:var(--soft2)}
.task .tx{flex:1}
.task .tx b{display:block;font-weight:600}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.done .chk{background:var(--ok);border-color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font:600 16px Onest,sans-serif;background:var(--acc);color:#fff;cursor:pointer;width:100%;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec{background:var(--acc2)}
.btn:disabled{opacity:.45}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.icon.rec{background:var(--acc);color:#fff;border-color:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(232,97,60,.2)}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h2{flex:1}
.steps{display:flex;gap:6px;margin:10px 0 4px}
.steps span{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps span.on{background:var(--acc)}.steps span.ok{background:var(--ok)}
.word{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .en{font-weight:700;font-size:18px}
.word .tr{color:var(--acc2);font-size:13px}
.word .ru{color:var(--mute)}
.hide .ru{filter:blur(6px)}
.rule{background:var(--soft);border-radius:14px;padding:14px;line-height:1.6}
.ex{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex div{flex:1}.ex b{display:block}
.q{font:700 26px Unbounded,sans-serif;text-align:center;margin:18px 0 6px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 16px Onest,sans-serif;cursor:pointer}
.opt.good{border-color:var(--ok);background:var(--soft2)}
.opt.bad{border-color:var(--bad);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border-radius:14px}
.chips.ans{border:1.5px dashed var(--line);margin:12px 0}
.chip{padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Onest,sans-serif;cursor:pointer}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:500}
.fb.ok{background:var(--soft2);color:var(--ok)}.fb.no{background:var(--soft);color:var(--bad)}
.phr{padding:12px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .en{font-weight:600;font-size:17px}
.phr .ctrl{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.score{font-size:13px;font-weight:600;padding:4px 9px;border-radius:9px}
.score.ok{background:var(--soft2);color:var(--ok)}.score.no{background:var(--soft);color:var(--bad)}
.live{font-size:14px;color:var(--mute);margin-top:6px;font-style:italic}
.note{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.4}
.msg.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--acc2);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .ru{color:var(--mute);font-size:14px;margin-top:6px}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.msg .tools button{font:500 12px Onest,sans-serif;border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;padding:4px 8px;cursor:pointer}
.fix{align-self:flex-end;max-width:86%;background:var(--warn);border-radius:12px;padding:8px 11px;font-size:14px}
.compose{position:sticky;bottom:84px;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0}
textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Onest,sans-serif;padding:10px 12px}
input[type=search],input[type=time]{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Onest,sans-serif;padding:11px 13px}
.day{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.num{width:34px;height:34px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.day.ok .num{background:var(--ok);color:#fff}
.day.cur .num{background:var(--acc);color:#fff}
.day.soon{opacity:.5}
.wk{font-weight:600;margin:14px 0 2px;font-size:14px;color:var(--acc2)}
.mini{display:flex;gap:3px}.mini i{width:7px;height:7px;border-radius:50%;background:var(--line)}.mini i.on{background:var(--ok)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--acc)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Onest,sans-serif;cursor:pointer}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;max-width:130px;background:none;border:0;color:var(--mute);font:500 12px Onest,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;cursor:pointer}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:var(--acc)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.3;transform:translateY(-3px)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="course/m01.js"></script>
<script src="course/m02.js"></script>
<script src="course/m03.js"></script>
<script src="course/m04.js"></script>
<script src="course/m05.js"></script>
<script src="course/m06.js"></script>
<script src="course/m07.js"></script>
<script src="course/m08.js"></script>
<script src="course/m09.js"></script>
<script src="course/m10.js"></script>
<script src="course/m11.js"></script>
<script src="course/m12.js"></script>
<script src="app.js"></script>
</body>
</html>
